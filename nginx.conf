server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Try the static file, then fall back to index.html
    # (safe for SPA routing if you later add real routes)
    location / {
        try_files $uri /index.html;
    }

    # Basic compression / headers can be tuned later if needed
}
